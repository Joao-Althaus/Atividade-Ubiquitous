services:
  postgres:
    build: ./database
    container_name: users-postgres
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: users
      POSTGRES_PASSWORD: users_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: users-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/servers.json:/pgadmin4/servers.json:ro

  go-api:
    build: ./GO_API
    ports: ["8081:8080"]
    environment: &db_env
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: users_db
      DB_USER: users
      DB_PASSWORD: users_dev_password
      DB_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy

  python-api:
    build: ./Python_API
    ports: ["8082:8080"]
    environment: *db_env
    depends_on:
      postgres:
        condition: service_healthy

  node-api:
    build: ./Node_API
    ports: ["8083:8080"]
    environment: *db_env
    depends_on:
      postgres:
        condition: service_healthy

  java-api:
    build: ./Java_API
    ports: ["8084:8080"]
    environment: *db_env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
